          - paragraph [ref=f6e80]: "Trust and economic intelligence — identity, attestation, and economic interaction. Research-only: no balances, transfers, rewards, or coin-gated access."
      - generic [ref=f6e81]:
        - article [ref=f6e82]:
          - heading "APT Passport — attestations" [level=3] [ref=f6e83]
          - paragraph [ref=f6e84]: Bounded, scoped claims about a participant's productive reality — issued by an issuer, scoped, consent-based, portable. Not a reputation score; not authority, credit, or ownership.
        - article [ref=f6e85]:
          - heading "APT Coin — economic instrument" [level=3] [ref=f6e86]
          - paragraph [ref=f6e87]: "A defined arrangement for economic interaction: purpose, terms, participants, settlement rules. Conditional — purpose undecided until a real coordination problem is evidenced."
        - article [ref=f6e88]:
          - heading "Intelligence Engine — findings" [level=3] [ref=f6e89]
          - paragraph [ref=f6e90]: Interprets relationships between identity, credentials, productive activity, institutional records, and economic interactions. The engine assesses; the authorized party decides.
      - generic [ref=f6e91]:
        - heading "Central relationship" [level=2] [ref=f6e92]
        - paragraph [ref=f6e93]:
          - strong [ref=f6e94]: Identity → Contribution → Attestation → Economic interaction.
          - text: Each transition has its own rules; none is automatic.
      - generic [ref=f6e95]:
        - heading "Boundaries" [level=2] [ref=f6e96]
        - list [ref=f6e97]:
          - listitem [ref=f6e98]: Credentials are not custody — participants retain and present them.
          - listitem [ref=f6e99]: No coin balances, transfers, token rewards, wages, or coin-gated access.
          - listitem [ref=f6e100]: No universal reputation score; a credential is not authority, credit, or ownership.
          - listitem [ref=f6e101]: The engine recommends; the authorized financing party decides.