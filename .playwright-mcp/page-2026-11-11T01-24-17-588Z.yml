          - heading "Intelligence" [level=1] [ref=f5e81]
          - paragraph [ref=f5e82]: "Trust and economic intelligence — identity, attestation, and economic interaction. Research-only: no balances, transfers, rewards, or coin-gated access."
      - generic [ref=f5e83]:
        - article [ref=f5e84]:
          - heading "APT Passport — attestations" [level=3] [ref=f5e85]
          - paragraph [ref=f5e86]: Bounded, scoped claims about a participant's productive reality — issued by an issuer, scoped, consent-based, portable. Not a reputation score; not authority, credit, or ownership.
        - article [ref=f5e87]:
          - heading "APT Coin — economic instrument" [level=3] [ref=f5e88]
          - paragraph [ref=f5e89]: "A defined arrangement for economic interaction: purpose, terms, participants, settlement rules. Conditional — purpose undecided until a real coordination problem is evidenced."
        - article [ref=f5e90]:
          - heading "Intelligence Engine — findings" [level=3] [ref=f5e91]
          - paragraph [ref=f5e92]: Interprets relationships between identity, credentials, productive activity, institutional records, and economic interactions. The engine assesses; the authorized party decides.
      - generic [ref=f5e93]:
        - heading "Central relationship" [level=2] [ref=f5e94]
        - paragraph [ref=f5e95]:
          - strong [ref=f5e96]: Identity → Contribution → Attestation → Economic interaction.
          - text: Each transition has its own rules; none is automatic.
      - generic [ref=f5e97]:
        - heading "Boundaries" [level=2] [ref=f5e98]
        - list [ref=f5e99]:
          - listitem [ref=f5e100]: Credentials are not custody — participants retain and present them.
          - listitem [ref=f5e101]: No coin balances, transfers, token rewards, wages, or coin-gated access.
          - listitem [ref=f5e102]: No universal reputation score; a credential is not authority, credit, or ownership.
          - listitem [ref=f5e103]: The engine recommends; the authorized financing party decides.