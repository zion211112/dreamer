<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1EFE8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="460" fill="#F7F5F0" />

  <text x="600" y="30" text-anchor="middle" font-family="Georgia" font-size="20" font-weight="bold" fill="#1A1D18">Three Demo Scenarios — End-to-End Chain</text>
  <text x="600" y="50" text-anchor="middle" font-size="12" fill="#4A5A52">Commons → School Console → Workbench → Local Workbench → Roll → SBT</text>

  <!-- Scenario 1: School workshop -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="360" height="360" rx="8" fill="url(#cardGrad)" stroke="#286375" stroke-width="2" />
    <rect x="0" y="0" width="360" height="44" rx="8" fill="#286375" />
    <text x="180" y="28" text-anchor="middle" font-family="Georgia" font-size="16" font-weight="bold" fill="#F7F5F0">Scenario 1 · School Workshop</text>
    <text x="20" y="58" font-size="11" fill="#4A5A52" font-weight="bold">Institution:</text>
    <text x="120" y="58" font-size="11" fill="#1A1D18">Kibera Makerspace</text>
    <text x="20" y="76" font-size="11" fill="#4A5A52" font-weight="bold">Location:</text>
    <text x="90" y="76" font-size="11" fill="#1A1D18">Kibera, Nairobi</text>
    <text x="20" y="94" font-size="11" fill="#4A5A52" font-weight="bold">Work kind:</text>
    <text x="100" y="94" font-size="11" fill="#1A1D18">physical-asset</text>
    <text x="20" y="112" font-size="11" fill="#4A5A52" font-weight="bold">Draft:</text>
    <text x="70" y="112" font-size="11" fill="#1A1D18">Kibera workshop bench set</text>
    <text x="20" y="130" font-size="11" fill="#4A5A52" font-weight="bold">Cost:</text>
    <text x="60" y="130" font-size="11" fill="#1A1D18">KES 85,000</text>
    <text x="20" y="148" font-size="11" fill="#4A5A52" font-weight="bold">Yield:</text>
    <text x="64" y="148" font-size="11" fill="#1A1D18">KES 120,000 / yr</text>
    <text x="20" y="166" font-size="11" fill="#4A5A52" font-weight="bold">Local spend:</text>
    <text x="100" y="166" font-size="11" fill="#1A1D18">78%</text>
    <rect x="20" y="190" width="320" height="40" rx="4" fill="#FFFFFF" stroke="#3D7158" stroke-width="1" />
    <text x="130" y="208" text-anchor="middle" font-size="9" fill="#4A5A52">Crew: Anchor 35,000 · Builder 30,000 · Apprentice 15,000</text>
    <rect x="20" y="240" width="320" height="100" rx="4" fill="#FFFFFF" stroke="#286375" stroke-width="1" />
    <text x="130" y="258" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Chain:</text>
    <text x="130" y="276" text-anchor="middle" font-size="9" fill="#4A5A52">signal-kibera-workshop → draft-kibera-workshop-bench → simulation</text>
    <text x="130" y="292" text-anchor="middle" font-size="9" fill="#4A5A52">→ Roll entry (physical) → SBT: anchor/builder/apprentice</text>
    <text x="130" y="312" text-anchor="middle" font-size="9" fill="#B8955A">Roll preview applies to physical-asset work</text>
    <text x="20" y="350" font-size="10" fill="#A5533D">Repairable workbenches · vices · tool storage · safety signage</text>
  </g>

  <!-- Scenario 2: Kemetos AGI1 -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="360" height="360" rx="8" fill="url(#cardGrad)" stroke="#286375" stroke-width="2" />
    <rect x="0" y="0" width="360" height="44" rx="8" fill="#286375" />
    <text x="180" y="28" text-anchor="middle" font-family="Georgia" font-size="16" font-weight="bold" fill="#F7F5F0">Scenario 2 · Kemetos AGI1</text>
    <text x="20" y="58" font-size="11" fill="#4A5A52" font-weight="bold">Institution:</text>
    <text x="120" y="58" font-size="11" fill="#1A1D18">APT-LABS Commons (demo)</text>
    <text x="20" y="76" font-size="11" fill="#4A5A52" font-weight="bold">Location:</text>
    <text x="90" y="76" font-size="11" fill="#1A1D18">Distributed</text>
    <text x="20" y="94" font-size="11" fill="#4A5A52" font-weight="bold">Work kind:</text>
    <text x="100" y="94" font-size="11" fill="#1A1D18">digital</text>
    <text x="20" y="112" font-size="11" fill="#4A5A52" font-weight="bold">Draft:</text>
    <text x="70" y="112" font-size="11" fill="#1A1D18">Kemetos AGI1 research station</text>
    <text x="20" y="130" font-size="11" fill="#4A5A52" font-weight="bold">Cost:</text>
    <text x="60" y="130" font-size="11" fill="#1A1D18">KES 0</text>
    <text x="20" y="148" font-size="11" fill="#4A5A52" font-weight="bold">Yield:</text>
    <text x="64" y="148" font-size="11" fill="#1A1D18">Contribution-based</text>
    <text x="20" y="166" font-size="11" fill="#4A5A52" font-weight="bold">Local spend:</text>
    <text x="100" y="166" font-size="11" fill="#1A1D18">100%</text>
    <rect x="20" y="190" width="320" height="40" rx="4" fill="#FFFFFF" stroke="#3D7158" stroke-width="1" />
    <text x="130" y="208" text-anchor="middle" font-size="9" fill="#4A5A52">Crew: Anchor 0 · Builder 0 · Apprentice 0 (no wages — rights-based)</text>
    <rect x="20" y="240" width="320" height="100" rx="4" fill="#FFFFFF" stroke="#286375" stroke-width="1" />
    <text x="130" y="258" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Chain:</text>
    <text x="130" y="276" text-anchor="middle" font-size="9" fill="#4A5A52">signal-kemetos-agi1 → draft-kemetos-agi-station → simulation</text>
    <text x="130" y="292" text-anchor="middle" font-size="9" fill="#4A5A52">→ Roll entry (digital) → SBT: builder/coordinator</text>
    <text x="130" y="312" text-anchor="middle" font-size="9" fill="#B8955A">No roll preview — digital work kind</text>
    <text x="20" y="350" font-size="10" fill="#A5533D">Repository access · test harness · verification pipeline · contribution summary</text>
  </g>

  <!-- Scenario 3: Thiba Hydro -->
  <g transform="translate(800, 70)">
    <rect x="0" y="0" width="360" height="360" rx="8" fill="url(#cardGrad)" stroke="#286375" stroke-width="2" />
    <rect x="0" y="0" width="360" height="44" rx="8" fill="#286375" />
    <text x="180" y="28" text-anchor="middle" font-family="Georgia" font-size="16" font-weight="bold" fill="#F7F5F0">Scenario 3 · Thiba Hydro</text>
    <text x="20" y="58" font-size="11" fill="#4A5A52" font-weight="bold">Institution:</text>
    <text x="120" y="58" font-size="11" fill="#1A1D18">APT-LABS Commons (demo)</text>
    <text x="20" y="76" font-size="11" fill="#4A5A52" font-weight="bold">Location:</text>
    <text x="90" y="76" font-size="11" fill="#1A1D18">Thiba, Kenya</text>
    <text x="20" y="94" font-size="11" fill="#4A5A52" font-weight="bold">Work kind:</text>
    <text x="100" y="94" font-size="11" fill="#1A1D18">hybrid fabrication</text>
    <text x="20" y="112" font-size="11" fill="#4A5A52" font-weight="bold">Draft:</text>
    <text x="70" y="112" font-size="11" fill="#1A1D18">Thiba Hydro fabrication rig</text>
    <text x="20" y="130" font-size="11" fill="#4A5A52" font-weight="bold">Cost:</text>
    <text x="60" y="130" font-size="11" fill="#1A1D18">KES 120,000</text>
    <text x="20" y="148" font-size="11" fill="#4A5A52" font-weight="bold">Yield:</text>
    <text x="64" y="148" font-size="11" fill="#1A1D18">KES 200,000 / yr</text>
    <text x="20" y="166" font-size="11" fill="#4A5A52" font-weight="bold">Local spend:</text>
    <text x="100" y="166" font-size="11" fill="#1A1D18">85%</text>
    <rect x="20" y="190" width="320" height="40" rx="4" fill="#FFFFFF" stroke="#3D7158" stroke-width="1" />
    <text x="130" y="208" text-anchor="middle" font-size="9" fill="#4A5A52">Crew: Anchor 45,000 · Builder 40,000 · Apprentice 25,000</text>
    <rect x="20" y="240" width="320" height="100" rx="4" fill="#FFFFFF" stroke="#286375" stroke-width="1" />
    <text x="130" y="258" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Chain:</text>
    <text x="130" y="276" text-anchor="middle" font-size="9" fill="#4A5A52">signal-thiba-hydro → draft-thiba-hydro-rig → simulation</text>
    <text x="130" y="292" text-anchor="middle" font-size="9" fill="#4A5A52">→ Roll entry (hybrid) → SBT: anchor/builder/apprentice</text>
    <text x="130" y="312" text-anchor="middle" font-size="9" fill="#B8955A">Roll preview applies to physical component</text>
    <text x="20" y="350" font-size="10" fill="#A5533D">Frame assembly · materials · safety controls · inspection method · site access</text>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="1120" height="16" rx="4" fill="#FFFFFF" stroke="#4A5A52" stroke-width="1" />
    <text x="12" y="12" font-size="10" fill="#4A5A52">All data is browser-local demo data · Call window.seedAPTLabsDemo() to populate · Record basis: illustrative</text>
  </g>
</svg>