<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A1D18" />
    </marker>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1EFE8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="#F7F5F0" />

  <!-- Stage 1: Commons -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="url(#stageGrad)" stroke="#1A1D18" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-family="Georgia" font-size="18" font-weight="bold" fill="#1A1D18">1 · Commons</text>
    <text x="100" y="52" text-anchor="middle" font-size="11" fill="#4A5A52">Field signals &amp; steward decisions</text>
    <rect x="20" y="70" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#4A5A52" stroke-width="1" />
    <text x="100" y="90" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Kibera Makerspace · bench capacity</text>
    <text x="100" y="104" text-anchor="middle" font-size="9" fill="#4A5A52">signal-kibera-workshop · triaged</text>
    <rect x="20" y="140" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#4A5A52" stroke-width="1" />
    <text x="100" y="160" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Kemetos AGI1 · research station</text>
    <text x="100" y="174" text-anchor="middle" font-size="9" fill="#4A5A52">signal-kemetos-agi1 · new</text>
    <rect x="20" y="210" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#4A5A52" stroke-width="1" />
    <text x="100" y="230" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Thiba Hydro · fabrication rig</text>
    <text x="100" y="244" text-anchor="middle" font-size="9" fill="#4A5A52">signal-thiba-hydro · urgent</text>
    <text x="100" y="285" text-anchor="middle" font-size="9" fill="#B8955A">localStorage · aptlabs:field-signals:v1</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="270" y1="150" x2="330" y2="150" stroke="#1A1D18" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#4A5A52">sourceConsoleDraftId</text>

  <!-- Stage 2: School Console -->
  <g transform="translate(340, 60)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="url(#stageGrad)" stroke="#1A1D18" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-family="Georgia" font-size="18" font-weight="bold" fill="#1A1D18">2 · School Console</text>
    <text x="100" y="52" text-anchor="middle" font-size="11" fill="#4A5A52">Tender drafts &amp; need scoping</text>
    <rect x="20" y="70" width="160" height="55" rx="4" fill="#FFFFFF" stroke="#3D7158" stroke-width="1" />
    <text x="100" y="90" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Kibera workshop bench set</text>
    <text x="100" y="103" text-anchor="middle" font-size="9" fill="#4A5A52">draft-kibera-workshop-bench</text>
    <rect x="20" y="135" width="160" height="55" rx="4" fill="#FFFFFF" stroke="#3D7158" stroke-width="1" />
    <text x="100" y="155" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Kemetos AGI1 station</text>
    <text x="100" y="168" text-anchor="middle" font-size="9" fill="#4A5A52">draft-kemetos-agi-station</text>
    <rect x="20" y="200" width="160" height="55" rx="4" fill="#FFFFFF" stroke="#3D7158" stroke-width="1" />
    <text x="100" y="220" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Thiba Hydro rig</text>
    <text x="100" y="233" text-anchor="middle" font-size="9" fill="#4A5A52">draft-thiba-hydro-rig</text>
    <text x="100" y="285" text-anchor="middle" font-size="9" fill="#B89552">IndexedDB · school-console-storage</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="550" y1="150" x2="610" y2="150" stroke="#1A1D18" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="580" y="140" text-anchor="middle" font-size="10" fill="#4A5A52">createWorkbenchSimulation</text>

  <!-- Stage 3: Workbench -->
  <g transform="translate(620, 60)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="url(#stageGrad)" stroke="#1A1D18" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-family="Georgia" font-size="18" font-weight="bold" fill="#1A1D18">3 · Workbench</text>
    <text x="100" y="52" text-anchor="middle" font-size="11" fill="#4A5A52">6-stage simulation pipeline</text>
    <rect x="20" y="70" width="160" height="180" rx="4" fill="#FFFFFF" stroke="#286375" stroke-width="1" />
    <text x="100" y="90" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Simulation stages:</text>
    <text x="30" y="106" text-anchor="start" font-size="9" fill="#4A5A52">· candidate_drafted</text>
    <text x="30" y="120" text-anchor="start" font-size="9" fill="#4A5A52">· tender_review_simulated</text>
    <text x="30" y="134" text-anchor="start" font-size="9" fill="#4A5A52">· assembly_simulated</text>
    <text x="30" y="148" text-anchor="start" font-size="9" fill="#4A5A52">· delivery_simulated</text>
    <text x="30" y="162" text-anchor="start" font-size="9" fill="#4A5A52">· acceptance_simulated</text>
    <text x="30" y="176" text-anchor="start" font-size="9" fill="#4A5A52">· roll_preview</text>
    <text x="100" y="200" text-anchor="middle" font-size="9" fill="#B8955A">localStorage · workbench simulations</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="830" y1="150" x2="890" y2="150" stroke="#1A1D18" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="860" y="140" text-anchor="middle" font-size="10" fill="#4A5A52">rollPreview → createRollFromSimulation</text>

  <!-- Stage 4: Roll -->
  <g transform="translate(900, 60)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="url(#stageGrad)" stroke="#1A1D18" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-family="Georgia" font-size="18" font-weight="bold" fill="#1A1D18">4 · Roll</text>
    <text x="100" y="52" text-anchor="middle" font-size="11" fill="#4A5A52">Evidential ledger &amp; acceptance</text>
    <rect x="20" y="70" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#A5533D" stroke-width="1" />
    <text x="100" y="90" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Roll entry + hash_anchor</text>
    <text x="100" y="104" text-anchor="middle" font-size="9" fill="#4A5A52">SHA-256 canonical JSON</text>
    <rect x="20" y="140" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#A5533D" stroke-width="1" />
    <text x="100" y="160" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Evidence layers</text>
    <text x="100" y="174" text-anchor="middle" font-size="9" fill="#4A5A52">public · participant · restricted</text>
    <rect x="20" y="210" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#A5533D" stroke-width="1" />
    <text x="100" y="230" text-anchor="middle" font-size="10" fill="#1A1D18" font-weight="bold">Acceptance block</text>
    <text x="100" y="244" text-anchor="middle" font-size="9" fill="#4A5A52">accepted_by · accepted_at</text>
    <text x="100" y="285" text-anchor="middle" font-size="9" fill="#B8955A">localStorage · demo_roll_entries</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="1110" y1="150" x2="1170" y2="150" stroke="#1A1D18" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="1140" y="140" text-anchor="middle" font-size="10" fill="#4A5A52">mintSBTAttestation</text>

  <!-- Stage 5: SBT -->
  <g transform="translate(1000, 240)">
    <rect x="0" y="0" width="160" height="140" rx="8" fill="#286375" stroke="#1A1D18" stroke-width="2" />
    <text x="80" y="30" text-anchor="middle" font-family="Georgia" font-size="18" font-weight="bold" fill="#F7F5F0">5 · SBT</text>
    <text x="80" y="52" text-anchor="middle" font-size="11" fill="#F1EFE8">Soulbound attestations</text>
    <rect x="10" y="70" width="140" height="50" rx="4" fill="#1A1D18" stroke="#F7F5F0" stroke-width="1" />
    <text x="80" y="90" text-anchor="middle" font-size="10" fill="#F7F5F0" font-weight="bold">aptlabs.sbt.v1</text>
    <text x="80" y="104" text-anchor="middle" font-size="8" fill="#B8955A">localStorage · aptlabs:sbt-attestations:v1</text>
    <text x="80" y="124" text-anchor="middle" font-size="9" fill="#F1EFE8">portable · mock-signed</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="1080" height="30" rx="4" fill="#FFFFFF" stroke="#4A5A52" stroke-width="1" />
    <text x="12" y="12" font-size="10" fill="#4A5A52" font-weight="bold">Demo scenarios:</text>
    <text x="140" y="12" font-size="10" fill="#4A5A52">School workshop (physical-asset) · Kemetos AGI1 (digital) · Thiba Hydro (hybrid fabrication)</text>
    <text x="700" y="12" font-size="10" fill="#4A5A52">All browser-local · mock proto · no on-chain claims</text>
  </g>
</svg>