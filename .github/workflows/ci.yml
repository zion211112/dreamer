name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # @v5 actions run on a supported Node runtime, which is what clears the
          # "Node.js 20 is deprecated" notice. Keep the *build* runtime pinned to 22:
          # commit 74c5e5f verified 24 breaks the Next 14 build, 22 does not.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run audit:classes
      - run: npm run audit:company
      - run: npm run audit:funder
      - run: npm run build